<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hire talent | Novura</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/web.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/cloud.css" />
    <link rel="stylesheet" href="styles/machine.css" />
    <link rel="stylesheet" href="styles/contact.css" />
    <link rel="stylesheet" href="styles/contact1.css" />
  </head>
  <body>
    <!--  section of contact   page   -->
<section class="py-5" style="background-color: #f8fafc;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="payment-card shadow-sm border-0 rounded-4 p-4 p-md-5" style="background-color: #ffffff;">
                    
                    <h2 class="text-center fw-bold mb-5 text-uppercase" style="font-family: sans-serif; letter-spacing: 1px; color: var(--var-dark-bg);">
                        Pay Your Bill
                    </h2>

                    <form id="billingForm" class="row g-4">
                        <div class="col-12">
                            <label class="form-label fw-semibold small text-muted">Full Name</label>
                            <input type="text" class="form-control billing-input" placeholder="Enter your full name" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">Amount ($)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">$</span>
                                <input type="number" class="form-control billing-input border-start-0" 
                                       min="0" max="999" step="0.01" 
                                       placeholder="0.00" 
                                       oninput="if(value.length>3)value=value.slice(0,3)" required>
                            </div>
                            <div class="form-text" style="font-size: 0.75rem;">Max amount: $999</div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">ZIP Code</label>
                            <input type="text" class="form-control billing-input" 
                                   pattern="[0-9]{5}" maxlength="5" 
                                   placeholder="12345" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold small text-muted">Card Type</label>
                            <select class="form-select billing-input" required>
                                <option value="" selected disabled>Select your card...</option>
                                <option value="visa">Visa</option>
                                <option value="master">MasterCard</option>
                            </select>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-continue w-100 py-3 fw-bold text-uppercase">
                                Continue to Payment
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
